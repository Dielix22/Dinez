spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urgencias_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The provided database may already contain objects in the schema. Baseline at 0 so that every migration (V1+) is still applied.
    baseline-on-migrate: true
    baseline-version: 0

  